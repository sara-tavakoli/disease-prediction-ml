services:
  api:
    build: .
    image: sepsis-early-warning:latest
    ports:
      - "8000:8000"
    environment:
      SEPSIS_RUN_DIR: /app/artifacts/run
    volumes:
      # mount a trained run produced by `sepsis train ... output_dir=artifacts/run`
      - ./artifacts/run:/app/artifacts/run:ro
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.1
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    restart: unless-stopped

volumes:
  mlflow-data:
