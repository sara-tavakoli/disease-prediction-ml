name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.5.7
      - run: ruff check src tests
      - run: ruff format --check src tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Unit tests (fast)
        run: pytest -m "not slow" --cov=sepsis --cov-report=xml -q
      - name: End-to-end pipeline (slow)
        if: matrix.python-version == '3.11'
        run: pytest -m slow -q
      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  smoke-train:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Train transformer on synthetic data (2 epochs)
        run: |
          sepsis train --config configs/base.yaml configs/smoke.yaml configs/model_transformer.yaml \
            --set output_dir=artifacts/ci_tf
      - name: Assert bundle is servable
        run: |
          test -f artifacts/ci_tf/results.json
          test -f artifacts/ci_tf/model.pt
          python -c "from sepsis.serve.inference import SepsisPredictor; SepsisPredictor('artifacts/ci_tf'); print('bundle OK')"
      - uses: actions/upload-artifact@v4
        with:
          name: ci-transformer-run
          path: artifacts/ci_tf
